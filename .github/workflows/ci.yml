name: CI

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Release build
        run: cargo build --release --locked
      - name: Verify both binaries
        shell: bash
        run: |
          if [ -f target/release/deoxidizer.exe ]; then
            ./target/release/deoxidizer.exe --version
            ./target/release/deox.exe --version
          else
            ./target/release/deoxidizer --version
            ./target/release/deox --version
          fi

  release-tools:
    name: Node release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run check:license
      - run: npm run check:version
      - run: npm run check:changelog
      - run: npm run quality:node
      - run: bash -n install.sh scripts/*.sh
