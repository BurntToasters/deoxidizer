version: 2
updates:
  # Cooldowns mirror the repo's age gates (scripts/cargo-safe-update.cjs:
  # 72h crates.io publish age; scripts/npm-safe-update.cjs: 3-day npm
  # min-release-age) so Dependabot never proposes a just-published release.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # A semver-major zip bump broke main, so Dependabot never opens major
    # Cargo updates. Majors go through the guarded `npm run update:safe` path
    # together with the code changes they require.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
