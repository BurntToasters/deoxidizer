[package]
name = "deoxidizer"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
authors = ["BurntToasters <code@rosie.run>"]
description = "Fast, safe disk space cleaner for Rust & Tauri build artifacts"
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/BurntToasters/deoxidizer"

[lib]
name = "deoxidizer_lib"
path = "src/lib.rs"

[[bin]]
name = "deoxidizer"
path = "src/main.rs"

[[bin]]
name = "deox"
path = "src/bin/deox.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
walkdir = "2.5"
colored = "3.0"
dialoguer = "0.11"
humansize = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
self-replace = "1.5"
ureq = { version = "2.10", features = ["json", "tls"] }
sha2 = "0.10"
hex = "0.4"
trash = "5.2"
dirs = "6.0"
flate2 = "1.0"
tar = "0.4"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
tempfile = "3"
semver = "1.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
