# cargo-deny policy: run `cargo deny check` (CI runs it on every push/PR).

[graph]
all-features = false

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound, yanked)
# fails the check unless explicitly ignored here with a reason.
ignore = []

[licenses]
# Licenses compatible with distributing deoxidizer under GPL-3.0-or-later.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
